.k{font:600 12px/1.2 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
h1{font-weight:300;font-size:clamp(44px,9vw,72px);line-height:1;letter-spacing:-.03em;margin:14px 0 16px}
h1 span{color:var(--acc)}
p{font-weight:300;font-size:19px;line-height:1.5;color:var(--fg2);margin-bottom:34px}
form{display:flex;gap:10px}
input{flex:1;min-width:0;background:transparent;border:1px solid var(--line);border-radius:12px;color:#fff;font:400 18px 'Outfit',system-ui,sans-serif;padding:16px 18px;letter-spacing:.04em;outline:none;transition:border-color .2s}

input::placeholder{color:#7F8C87}
button{background:var(--acc);color:#0E1312;border:0;border-radius:12px;font:400 18px 'Outfit',system-ui,sans-serif;padding:16px 24px;cursor:pointer;transition:transform .15s,opacity .2s}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.6;cursor:wait}
.msg{min-height:24px;margin-top:14px;font:400 15px system-ui,sans-serif;color:#E9A090}
.foot{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:0 20px;text-align:center;font:400 12px/1.7 system-ui,sans-serif;letter-spacing:.03em;color:#8D9A95}.foot b{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#B9C4BF}
@media (max-height:620px){.foot{position:static;margin-top:40px}body{display:block;overflow:auto;padding:40px 0}main{margin:0 auto}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:480px){form{flex-direction:column}.kt{height:54px}.bv{height:24px}}
@media (prefers-reduced-motion:reduce){main,.shake{animation:none}}

 function utf8(s){s=unescape(encodeURIComponent(s));var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
 /* SHA-256 en HMAC in gewone JavaScript, zodat dit in elke browser en ook lokaal werkt */
 var K=new Int32Array(64),H0=new Int32Array(8),W=new Int32Array(64);
 (function(){var n=0,p=2;function fr(x){return ((x-Math.floor(x))*4294967296)|0;}
  for(;n<64;p++){var ok=true;for(var d=2;d*d<=p;d++){if(p%d===0){ok=false;break;}}if(ok){if(n<8)H0[n]=fr(Math.sqrt(p));K[n++]=fr(Math.pow(p,1/3));}}})();
 function comp(H,m,o){var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7],i,t1,t2,x,y;
  for(i=0;i<16;i++){W[i]=(m[o]<<24)|(m[o+1]<<16)|(m[o+2]<<8)|m[o+3];o+=4;}
  for(i=16;i<64;i++){x=W[i-15];y=W[i-2];W[i]=(W[i-16]+(((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3))+W[i-7]+(((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10)))|0;}
  for(i=0;i<64;i++){t1=(h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+W[i])|0;
   t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;}
 function sha(init,m,pre){var H=new Int32Array(init),n=m.length,full=n-(n%64),i;for(i=0;i<full;i+=64)comp(H,m,i);
  var rest=n-full,pad=new Uint8Array(rest<56?64:128);pad.set(m.subarray(full));pad[rest]=128;var bits=(pre+n)*8,L=pad.length;
  pad[L-1]=bits&255;pad[L-2]=(bits>>>8)&255;pad[L-3]=(bits>>>16)&255;pad[L-4]=(bits>>>24)&255;pad[L-5]=Math.floor((pre+n)/536870912)&255;
  for(i=0;i<L;i+=64)comp(H,pad,i);var out=new Uint8Array(32);for(i=0;i<8;i++){out[i*4]=H[i]>>>24;out[i*4+1]=(H[i]>>>16)&255;out[i*4+2]=(H[i]>>>8)&255;out[i*4+3]=H[i]&255;}return out;}
 function hkey(k){if(k.length>64)k=sha(H0,k,0);var ip=new Uint8Array(64),op=new Uint8Array(64),i;for(i=0;i<64;i++){var v=i<k.length?k[i]:0;ip[i]=v^54;op[i]=v^92;}
  var a=new Int32Array(H0),b=new Int32Array(H0);comp(a,ip,0);comp(b,op,0);return {i:a,o:b};}
 function hmac(k,m){return sha(k.o,sha(k.i,m,64),64);}
 function pbkdf2(pw,salt,n,len){var k=hkey(pw),out=new Uint8Array(len),blk=1,pos=0;while(pos<len){var s=new Uint8Array(salt.length+4);s.set(salt);s[salt.length+3]=blk;
   var U=hmac(k,s),T=new Uint8Array(U);for(var i=1;i<n;i++){U=hmac(k,U);for(var j=0;j<32;j++)T[j]^=U[j];}out.set(T.subarray(0,Math.min(32,len-pos)),pos);pos+=32;blk++;}return out;}
 var f=document.getElementById('f'),c=document.getElementById('c'),b=document.getElementById('b'),m=document.getElementById('m');
 function fail(quiet,txt){b.disabled=false;b.textContent='Open het voorstel';if(quiet)return;m.textContent=txt;f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');c.select();}
 function open(code,quiet){
  var html;
  try{
   var pw=utf8(norm(code)),ct=u(C),want=u(D.t),dk=null,i,q;
   for(q=0;q<D.k.length&&!dk;q++){var kd=pbkdf2(pw,u(D.k[q].s),D.n,64),w=u(D.k[q].w),m2=new Uint8Array(64);for(i=0;i<64;i++)m2[i]=w[i]^kd[i];
    var tg=hmac(hkey(m2.subarray(32)),ct),ok=0;for(i=0;i<32;i++)ok|=tg[i]^want[i];if(ok===0)dk=m2;}
   if(!dk){fail(quiet,'Die code klopt niet. Probeer het opnieuw.');return;}
   var ek=hkey(dk.subarray(0,32)),cnt=new Uint8Array(4),n=ct.length,pt=new Uint8Array(n),j,ks,z;
   for(i=0,j=0;i<n;i+=32,j++){cnt[0]=j>>>24;cnt[1]=(j>>>16)&255;cnt[2]=(j>>>8)&255;cnt[3]=j&255;ks=hmac(ek,cnt);for(z=0;z<32&&i+z<n;z++)pt[i+z]=ct[i+z]^ks[z];}
   if(window.TextDecoder){html=new TextDecoder('utf-8').decode(pt);}else{var s='';for(i=0;i<n;i+=8192)s+=String.fromCharCode.apply(null,pt.subarray(i,i+8192));html=decodeURIComponent(escape(s));}
  }catch(e){fail(quiet,'Er ging iets mis bij het openen. Open dit bestand in Chrome, Safari of Edge.');return;}
  try{sessionStorage.setItem('bv-code',code);}catch(e){}
  document.open();document.write(html);document.close();
 }
 f.addEventListener('submit',function(ev){ev.preventDefault();if(!c.value)return;m.textContent='';b.disabled=true;b.textContent='Even geduld';var v=c.value;setTimeout(function(){open(v,false);},30);});
 try{var s=sessionStorage.getItem('bv-code');if(s){document.documentElement.style.visibility='hidden';
  var go=function(){setTimeout(function(){open(s,true);if(document.getElementById('f'))document.documentElement.style.visibility='';},0);};
  if(document.readyState==='complete')go();else window.addEventListener('load',go);}}catch(e){document.documentElement.style.visibility='';}
})();
