.k{font:600 12px/1.2 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
h1{font-weight:300;font-size:clamp(44px,9vw,72px);line-height:1;letter-spacing:-.03em;margin:14px 0 16px}
h1 span{color:var(--acc)}
p{font-weight:300;font-size:19px;line-height:1.5;color:var(--fg2);margin-bottom:34px}
form{display:flex;gap:10px}
input{flex:1;min-width:0;background:transparent;border:1px solid var(--line);border-radius:12px;color:#fff;font:400 18px 'Outfit',system-ui,sans-serif;padding:16px 18px;letter-spacing:.04em;outline:none;transition:border-color .2s}

input::placeholder{color:#7F8C87}
button{background:var(--acc);color:#0E1312;border:0;border-radius:12px;font:400 18px 'Outfit',system-ui,sans-serif;padding:16px 24px;cursor:pointer;transition:transform .15s,opacity .2s}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.6;cursor:wait}
.msg{min-height:24px;margin-top:14px;font:400 15px system-ui,sans-serif;color:#E9A090}
.foot{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:0 20px;text-align:center;font:400 12px/1.7 system-ui,sans-serif;letter-spacing:.03em;color:#8D9A95}.foot b{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#B9C4BF}
@media (max-height:620px){.foot{position:static;margin-top:40px}body{display:block;overflow:auto;padding:40px 0}main{margin:0 auto}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:480px){form{flex-direction:column}.kt{height:54px}.bv{height:24px}}
@media (prefers-reduced-motion:reduce){main,.shake{animation:none}}
